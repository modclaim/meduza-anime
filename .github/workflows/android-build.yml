name: Build Android App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/meduza.jks
          cat <<EOF > keystore.properties
          storeFile=keystore/meduza.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build Android Release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease :composeApp:assembleDebug --stacktrace

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MeduzaAnime-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Android Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: MeduzaAnime-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
